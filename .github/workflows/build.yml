name: Build Desktop (Windows & Linux)

on:
  push:
    tags:
      - "v*" # On déclenche la release automatique uniquement sur les tags
  workflow_dispatch: # Permet de le lancer à la main si besoin

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            os: "windows"
            name: "Windows"
          - platform: "ubuntu-22.04"
            os: "linux"
            name: "Linux"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Release Tauri Application
        uses: tauri-apps/tauri-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "MUSIK v__VERSION__"
          releaseBody: "Nouvelle version de MUSIK pour Windows et Linux."
          releaseDraft: false # Passe à false pour publier automatiquement sans rester en brouillon
          prerelease: false
