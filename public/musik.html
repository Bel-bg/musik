<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>MUSIK, lecteur de musique</title>
    <meta
      name="description"
      content="MUSIK, lecteur de musique desktop open source au design skeuomorphique."
    />
    <link rel="icon" type="image/png" href="icon.png" />
    <script>
      document.documentElement.className = "js";
    </script>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        src: url("Bricolage_Grotesque/BricolageGrotesque-VariableFont_opsz,wdth,wght.ttf")
          format("truetype");
        font-weight: 200 800;
        font-stretch: 75% 100%;
        font-display: swap;
      }
      :root {
        --h: 58px;
        --amber: #f59e0b;
        --glow: #ffb259;
        --cyan: #06b6d4;
        --mut: #848b9d;
        --screw: radial-gradient(
          circle at 35% 30%,
          #9aa0b0,
          #4a4d5a 55%,
          #20222a
        );
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        background:
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.012) 0 1px,
            transparent 1px 4px
          ),
          linear-gradient(180deg, #101217, #08090c);
        background-attachment: fixed;
        color: #f1f2f6;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        line-height: 1.5;
        overflow-x: hidden;
      }
      .mono {
        font-family: ui-monospace, Menlo, Consolas, monospace;
      }

      /* barre du haut */
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        height: var(--h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 max(16px, env(safe-area-inset-left));
        background: linear-gradient(180deg, #2a2d39, #14161d);
        border-bottom: 1px solid #000;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.14),
          0 8px 20px rgba(0, 0, 0, 0.6);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 1.15rem;
        letter-spacing: -0.02em;
        color: #fff;
        text-decoration: none;
      }
      .brand img {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.6);
      }
      .acts {
        display: flex;
        gap: 10px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 9px 14px;
        border-radius: 9px;
        font-weight: 700;
        font-size: 0.85rem;
        color: var(--glow);
        text-decoration: none;
        border: 1px solid #000;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.12),
            transparent 48%,
            rgba(0, 0, 0, 0.25) 52%
          ),
          linear-gradient(180deg, #383c49, #22252e);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.22),
          0 3px 0 #0d0e13,
          0 6px 12px rgba(0, 0, 0, 0.55);
        transition:
          transform 80ms,
          box-shadow 80ms;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow:
          inset 0 2px 6px rgba(0, 0, 0, 0.8),
          0 0 0 #0d0e13;
      }
      .btn.hot {
        color: #241100;
        border-color: #3c1900;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.3),
            transparent 48%,
            rgba(0, 0, 0, 0.15) 52%
          ),
          linear-gradient(180deg, #ffc98a, #ff9d33 50%, #df7812);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.65),
          0 3px 0 #7a3a05,
          0 6px 14px rgba(0, 0, 0, 0.6),
          0 0 16px rgba(255, 157, 51, 0.35);
      }
      .btn.hot:active {
        box-shadow:
          inset 0 2px 6px rgba(90, 35, 0, 0.7),
          0 0 0 #7a3a05;
      }
      .btn svg {
        width: 16px;
        height: 16px;
        flex: none;
      }
      a:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 3px;
      }

      /* scène */
      .stage {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 48px;
        max-width: 1280px;
        margin: 0 auto;
        padding: 28px 24px 0;
      }

      /* rack fixe */
      .rack {
        position: sticky;
        top: calc(var(--h) + 24px);
        align-self: start;
        max-height: calc(100svh - var(--h) - 48px);
        overflow: auto;
        padding: 22px 18px;
        border-radius: 16px;
        border: 1px solid #000;
        background:
          repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.02) 0 1px,
            transparent 1px 3px
          ),
          linear-gradient(180deg, #252833, #171922);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.18),
          inset 0 -1px 0 rgba(0, 0, 0, 0.6),
          0 18px 36px rgba(0, 0, 0, 0.7);
      }
      .rack::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          var(--screw) 9px 9px/9px 9px no-repeat,
          var(--screw) calc(100% - 9px) 9px/9px 9px no-repeat,
          var(--screw) 9px calc(100% - 9px) / 9px 9px no-repeat,
          var(--screw) calc(100% - 9px) calc(100% - 9px) / 9px 9px no-repeat;
      }
      .vfd {
        position: relative;
        overflow: hidden;
        padding: 14px;
        border-radius: 10px;
        border: 1px solid #000;
        background: radial-gradient(ellipse at 50% 20%, #0d121c, #05070a);
        box-shadow:
          inset 0 3px 10px rgba(0, 0, 0, 0.95),
          0 1px 0 rgba(255, 255, 255, 0.07);
      }
      .vfd::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          linear-gradient(170deg, rgba(255, 255, 255, 0.05), transparent 35%),
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.22) 0 1px,
            transparent 1px 3px
          );
      }
      .idx {
        font-size: 0.72rem;
        color: var(--cyan);
        text-shadow: 0 0 10px rgba(6, 182, 212, 0.6);
      }
      .ttl {
        margin-top: 6px;
        font-size: 1.35rem;
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.01em;
        color: var(--glow);
        text-shadow:
          0 0 10px rgba(245, 158, 11, 0.6),
          0 0 22px rgba(245, 158, 11, 0.3);
      }
      .sub {
        margin-top: 6px;
        font-size: 0.85rem;
        color: var(--mut);
      }
      .flick {
        animation: flick 0.35s steps(2, end);
      }
      @keyframes flick {
        0% {
          opacity: 0.2;
        }
        40% {
          opacity: 1;
        }
        55% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }
      .rail {
        position: relative;
        height: 10px;
        margin-top: 16px;
        border-radius: 6px;
        background: #000;
        box-shadow:
          inset 0 1px 3px #000,
          0 1px 0 rgba(255, 255, 255, 0.08);
      }
      .knob {
        position: absolute;
        top: -4px;
        left: calc((100% - 22px) * var(--p, 0));
        width: 22px;
        height: 18px;
        border-radius: 4px;
        border: 1px solid #000;
        background: linear-gradient(180deg, #4a4f5e, #262932);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          0 3px 5px rgba(0, 0, 0, 0.7);
      }
      .knob::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 3px;
        bottom: 3px;
        width: 2px;
        margin-left: -1px;
        background: var(--amber);
        box-shadow: 0 0 6px var(--amber);
      }
      .keys {
        display: grid;
        gap: 12px;
        margin-top: 22px;
      }
      .key {
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        border: 0;
        background: none;
        color: var(--mut);
        font: inherit;
        font-weight: 700;
        text-align: left;
        cursor: pointer;
      }
      .cap {
        flex: none;
        display: grid;
        place-items: center;
        width: 46px;
        height: 40px;
        border-radius: 9px;
        border: 1px solid #000;
        font-size: 0.85rem;
        color: #a9afc0;
        background:
          linear-gradient(
            180deg,
            rgba(255, 255, 255, 0.12),
            transparent 48%,
            rgba(0, 0, 0, 0.25) 52%
          ),
          linear-gradient(180deg, #383c49, #22252e);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.22),
          0 4px 0 #0b0c10,
          0 7px 10px rgba(0, 0, 0, 0.6);
        transition:
          transform 90ms,
          box-shadow 90ms,
          color 90ms;
      }
      .key:hover .cap {
        color: #ffc98a;
      }
      .key[aria-current="true"] {
        color: #fff;
      }
      .key[aria-current="true"] .cap {
        transform: translateY(3px);
        color: var(--glow);
        text-shadow: 0 0 8px rgba(245, 158, 11, 0.8);
        background: linear-gradient(180deg, #14161c, #20232c);
        box-shadow:
          inset 0 3px 7px rgba(0, 0, 0, 0.9),
          0 1px 0 #0b0c10;
      }
      .led {
        margin-left: auto;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2a1a05;
        box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.8);
      }
      .key[aria-current="true"] .led {
        background: var(--amber);
        box-shadow:
          0 0 9px var(--amber),
          inset 0 1px 1px rgba(255, 255, 255, 0.7);
      }

      /* captures, sans conteneur */
      .shot {
        min-height: 90svh;
        display: grid;
        place-items: center;
        padding: 5svh 0;
      }
      .shot img {
        display: block;
        width: auto;
        height: auto;
        max-width: min(100%, 1000px);
        max-height: min(78svh, 760px);
      }
      .js .shot img {
        opacity: 0.15;
        transform: translateY(60px) scale(0.94);
        filter: blur(3px) saturate(0.6);
        transition:
          opacity 0.8s cubic-bezier(0.2, 0.7, 0.2, 1),
          transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1),
          filter 0.8s;
      }
      .js .shot.on img {
        opacity: 1;
        transform: none;
        filter: none;
      }

      /* pied de page */
      footer {
        max-width: 1280px;
        margin: 40px auto 0;
        padding: 0 24px calc(40px + env(safe-area-inset-bottom));
      }
      .plate {
        padding: 22px 24px;
        border-radius: 12px;
        border: 1px solid #000;
        background: linear-gradient(180deg, #06070a, #0d0f15);
        box-shadow:
          inset 0 2px 8px rgba(0, 0, 0, 0.9),
          0 1px 0 rgba(255, 255, 255, 0.08);
        color: var(--mut);
      }
      .plate a {
        color: var(--glow);
        text-decoration: none;
        border-bottom: 1px solid rgba(255, 178, 89, 0.4);
      }
      .plate a:hover {
        border-color: var(--glow);
      }

      @media (max-width: 899px) {
        .stage {
          display: block;
          padding: 0 14px;
        }
        .rack {
          top: var(--h);
          z-index: 10;
          margin: 0 -14px;
          max-height: none;
          overflow: visible;
          padding: 10px 14px 14px;
          border-radius: 0 0 16px 16px;
        }
        .rack::before,
        .sub,
        .lbl,
        .led {
          display: none;
        }
        .vfd {
          padding: 10px 12px;
        }
        .ttl {
          font-size: 1.05rem;
        }
        .rail {
          margin-top: 12px;
        }
        .keys {
          display: flex;
          gap: 10px;
          margin-top: 14px;
          padding-bottom: 6px;
          overflow-x: auto;
        }
        .shot {
          min-height: 78svh;
        }
        footer {
          padding: 0 14px calc(32px + env(safe-area-inset-bottom));
        }
      }
      @media (max-width: 440px) {
        .btn .t {
          display: none;
        }
        .btn {
          padding: 9px 12px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        .js .shot img {
          opacity: 1;
          transform: none;
          filter: none;
          transition: none;
        }
        .flick {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="gh" viewBox="0 0 24 24">
        <path
          fill="currentColor"
          fill-rule="evenodd"
          d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
        />
      </symbol>
    </svg>

    <header>
      <a class="brand" href="#"><img src="icon.png" alt="" />MUSIK</a>
      <div class="acts">
        <a
          class="btn"
          href="https://github.com/Bel-bg/musik"
          target="_blank"
          rel="noopener noreferrer"
          ><svg><use href="#gh" /></svg><span class="t">GitHub</span></a
        >
        <a
          class="btn hot"
          href="https://github.com/Bel-bg/musik/releases"
          target="_blank"
          rel="noopener noreferrer"
          >Télécharger</a
        >
      </div>
    </header>

    <main class="stage">
      <aside class="rack" aria-label="Écrans de l'application">
        <div class="vfd" aria-live="polite">
          <div class="idx mono"></div>
          <div class="ttl"></div>
          <p class="sub"></p>
        </div>
        <div class="rail" aria-hidden="true"><i class="knob"></i></div>
        <nav class="keys"></nav>
      </aside>

      <div class="shots">
        <!-- Remplace les titres, légendes et chemins d'images par les tiens. Les initiales sont calculées depuis le titre. -->
        <section
          class="shot"
          data-title="Bienvenu"
          data-cap="SplashScreen de vôtre lecteur"
        >
          <img src="screenshots/1.png" alt="welcome" />
        </section>
        <section
          class="shot"
          data-title="Mes Playlists"
          data-cap="L'accueil avec la listes de vos Playlists"
        >
          <img src="screenshots/2.png" alt="splash" loading="lazy" />
        </section>
        <section
          class="shot"
          data-title="Nouveau"
          data-cap="Crée une nouvelle Playlists"
        >
          <img src="screenshots/3.png" alt="new" loading="lazy" />
        </section>
        <section
          class="shot"
          data-title="Supprimer"
          data-cap="Supprime une playlist existante"
        >
          <img src="screenshots/4.png" alt="delete" loading="lazy" />
        </section>
        <section
          class="shot"
          data-title="Paramètres"
          data-cap="Paramètres du lecteur"
        >
          <img src="screenshots/5.png" alt="params" loading="lazy" />
        </section>
        <section
          class="shot"
          data-title="Lecture..."
          data-cap="Playlist en cours de lecture"
        >
          <img src="screenshots/6.png" alt="lecture" loading="lazy" />
        </section>
        <section class="shot" data-title="Pause" data-cap="Lecture en Pause">
          <img src="screenshots/7.png" alt="pause" loading="lazy" />
        </section>
        <section
          class="shot"
          data-title="Options"
          data-cap="Afficher les options"
        >
          <img src="screenshots/8.png" alt="options" loading="lazy" />
        </section>
        <section
          class="shot"
          data-title="File D'attente"
          data-cap="File d'attente..."
        >
          <img src="screenshots/9.png" alt="waiting" loading="lazy" />
        </section>
        <section
          class="shot"
          data-title="Miniature"
          data-cap="Lecteur miniature"
        >
          <img src="screenshots/10.png" alt="miniature" loading="lazy" />
        </section>
      </div>
    </main>

    <footer>
      <p class="plate">
        MUSIK est un projet open source. Pour toute contribution vous pouvez
        rejoindre sur
        <a
          href="https://github.com/Bel-bg/musik"
          target="_blank"
          rel="noopener noreferrer"
          >github.com/Bel-bg/musik</a
        >. Développé par
        <a
          href="https://github.com/Bel-bg"
          target="_blank"
          rel="noopener noreferrer"
          >bel-dev</a
        >.
      </p>
    </footer>

    <script>
      const $ = (s) => document.querySelector(s),
        S = [...document.querySelectorAll(".shot")],
        keys = $(".keys"),
        rack = $(".rack"),
        vfd = $(".vfd"),
        stage = $(".stage");
      const ini = (t) => {
        const w = t.trim().split(/\s+/);
        return (
          w.length > 1 ? w[0][0] + w[w.length - 1][0] : t.slice(0, 2)
        ).toUpperCase();
      };
      S.forEach((s) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "key";
        b.innerHTML =
          '<span class="cap mono"></span><span class="lbl"></span><i class="led"></i>';
        b.querySelector(".cap").textContent = ini(s.dataset.title);
        b.querySelector(".lbl").textContent = s.dataset.title;
        b.setAttribute("aria-label", s.dataset.title);
        b.onclick = () =>
          s.scrollIntoView({ behavior: "smooth", block: "center" });
        keys.append(b);
        s._k = b;
      });
      let cur = -1;
      function set(i) {
        if (i === cur) return;
        cur = i;
        S.forEach((s, j) => {
          s.classList.toggle("on", j === i);
          s._k.setAttribute("aria-current", j === i);
        });
        $(".idx").textContent =
          String(i + 1).padStart(2, "0") +
          " / " +
          String(S.length).padStart(2, "0");
        $(".ttl").textContent = S[i].dataset.title;
        $(".sub").textContent = S[i].dataset.cap || "";
        vfd.classList.remove("flick");
        void vfd.offsetWidth;
        vfd.classList.add("flick");
      }
      const io = new IntersectionObserver(
        (es) =>
          es.forEach((e) => {
            if (e.isIntersecting) set(S.indexOf(e.target));
          }),
        { rootMargin: "-45% 0px -45% 0px" },
      );
      S.forEach((s) => io.observe(s));
      function prog() {
        const r = stage.getBoundingClientRect(),
          d = r.height - innerHeight;
        rack.style.setProperty(
          "--p",
          d > 0 ? Math.min(1, Math.max(0, -r.top / d)) : 0,
        );
      }
      addEventListener("scroll", prog, { passive: true });
      addEventListener("resize", prog);
      set(0);
      prog();
    </script>
  </body>
</html>
